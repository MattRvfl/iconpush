[package]
name = "iconpush"
version = "0.1.0"
edition = "2021"
description = "Custom iPhone home screen icons, pushed over USB. No jailbreak."
license = "MIT"
repository = "https://github.com/MattRvfl/iconpush"
readme = "README.md"
keywords = ["iphone", "ios", "icons", "mobileconfig", "usb"]
categories = ["command-line-utilities"]

[dependencies]
idevice = { version = "0.1.68", default-features = false, features = [
    "rustcrypto",
    "usbmuxd",
    "pair",
    "installation_proxy",
    "springboardservices",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
plist = "1"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
open = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
