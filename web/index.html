<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iconpush</title>
  <meta name="description" content="Des icônes personnalisées pour ton iPhone, sans jailbreak et sans bannière Raccourcis.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23111'/><rect x='22' y='22' width='24' height='24' rx='7' fill='%23fff'/><rect x='54' y='22' width='24' height='24' rx='7' fill='%237c8cff'/><rect x='22' y='54' width='24' height='24' rx='7' fill='%237c8cff'/><rect x='54' y='54' width='24' height='24' rx='7' fill='%23fff'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <h1>iconpush</h1>
    </div>
    <div id="device" class="device" role="status" aria-live="polite">…</div>
    <a class="ghost-link" href="https://github.com/MattRvfl/iconpush" target="_blank" rel="noopener">★ GitHub</a>
  </header>

  <main class="layout">
    <section class="panel">
      <h2><span class="step">1</span> Choisis un pack</h2>
      <input id="pack-search" type="search" placeholder="Rechercher un pack (glass, minimal, néon…)" aria-label="Rechercher un pack">
      <div id="packs" class="packs"></div>
    </section>

    <section class="panel">
      <h2><span class="step">2</span> Choisis tes apps</h2>
      <div class="toolbar">
        <input id="app-search" type="search" placeholder="Rechercher une app" aria-label="Rechercher une app">
        <select id="category" aria-label="Catégorie">
          <option value="">Toutes</option>
          <option value="music">Musique</option>
          <option value="social">Réseaux</option>
          <option value="messaging">Messages</option>
          <option value="video">Vidéo</option>
          <option value="tools">Outils</option>
          <option value="travel">Déplacements</option>
          <option value="system">Apple</option>
        </select>
      </div>
      <div class="toolbar small">
        <label class="check" id="only-installed-wrap" hidden><input type="checkbox" id="only-installed" checked> Seulement les apps de mon iPhone</label>
        <button type="button" class="link" id="select-all">Tout cocher</button>
        <button type="button" class="link" id="select-none">Tout décocher</button>
      </div>
      <div id="apps" class="apps"></div>
      <p class="hint">Astuce : clique sur 🖼 pour mettre ta propre image sur une app. Les apps marquées « ✓ testé » ont été vérifiées sur un vrai iPhone ; pour les autres, <a href="https://github.com/MattRvfl/iconpush/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">dis-nous si ça marche</a>.</p>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
    </section>

    <section class="panel preview-panel">
      <h2><span class="step">3</span> Aperçu et envoi</h2>
      <div class="phone">
        <div class="phone-screen">
          <div class="phone-grid" id="phone-grid"></div>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="hide-labels"> Masquer les noms sous les icônes</label>
      <p class="count" id="count"></p>
      <button type="button" id="go" class="primary big">…</button>
      <p class="hint" id="go-hint"></p>
    </section>
  </main>

  <dialog id="dialog">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <button class="primary">OK</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
