[package]
name = "iconpush"
version = "0.2.0"
edition = "2021"
description = "Custom iPhone home screen icons, pushed over USB. No jailbreak."
license = "MIT"
repository = "https://github.com/MattRvfl/iconpush"
readme = "README.md"
keywords = ["iphone", "ios", "icons", "mobileconfig", "usb"]
categories = ["gui"]

[dependencies]
# iPhone access over USB
idevice = { version = "0.1.68", default-features = false, features = [
    "rustcrypto",
    "usbmuxd",
    "pair",
    "installation_proxy",
    "diagnostics_relay",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
plist = "1"

# Native window
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
rfd = { version = "0.17", default-features = false }

# Icon rendering
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Downloads (official logos, iTunes installer) — native-tls = Windows' own TLS (Schannel)
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

# Data shared with the web version (web/data, web/packs, web/glyphs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Image decoding and rendering are slow in debug builds; optimize dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
